  <?!= include('client-utils'); ?>
  <script>
    const ADMIN_TOKEN_KEY = 'waitlist_admin_session_token';
    const UI = window.WaitlistUI;
    const SOURCE_ID_KEY = 'waitlist_source_id';
    let dashboard = null;
    let session = null;
    let dashboardReady = false;
    let statusPollTimer = null;
    let postQueue = Promise.resolve();
    const STATUS_POLL_MS = 10000;

    function getAdminToken() {
      return localStorage.getItem(ADMIN_TOKEN_KEY) || '';
    }

    function setAdminToken(token) {
      if (token) localStorage.setItem(ADMIN_TOKEN_KEY, token);
      else localStorage.removeItem(ADMIN_TOKEN_KEY);
    }

    function getSourceId() {
      let id = localStorage.getItem(SOURCE_ID_KEY);
      if (!id) {
        id = 'src_' + Date.now() + '_' + Math.random().toString(36).slice(2);
        localStorage.setItem(SOURCE_ID_KEY, id);
      }
      return id;
    }

    function getDefaultEventName() {
      return (dashboard && dashboard.default_event_name) || '不累的盃';
    }

    function getDefaultSessionName() {
      return (dashboard && dashboard.default_session_name) || '候補測試賽';
    }

    function parseWaitlistNos(str) {
      if (!str || !str.trim()) return [];
      return str.split(/[,，\s]+/)
        .map(s => s.replace(/^#/, '').trim())
        .filter(Boolean)
        .map(Number)
        .filter(n => !isNaN(n) && n > 0);
    }

    const DEADLINE_PRESETS = {
      '15m': 15,
      '30m': 30,
      '45m': 45,
      '1h': 60,
      '90m': 90,
      '2h': 120
    };

    function toTimeLocalValue(date) {
      const hour = String(date.getHours()).padStart(2, '0');
      const minute = String(date.getMinutes()).padStart(2, '0');
      return hour + ':' + minute;
    }

    function deadlineToTimeLocal(deadline) {
      if (!deadline) return '';
      const d = new Date(deadline);
      if (isNaN(d.getTime())) return '';
      return toTimeLocalValue(d);
    }

    function timeLocalToDate(timeLocal) {
      const parts = timeLocal.split(':');
      if (parts.length < 2) return null;

      const hour = parseInt(parts[0], 10);
      const minute = parseInt(parts[1], 10);

      if (isNaN(hour) || isNaN(minute)) return null;

      const now = new Date();
      const localDate = new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate(),
        hour,
        minute,
        0
      );

      if (isNaN(localDate.getTime())) return null;

      return localDate;
    }

    function timeLocalToDeadlineIso(timeLocal) {
      const localDate = timeLocalToDate(timeLocal);
      if (!localDate) return '';
      return localDate.toISOString();
    }

    function findMatchingDeadlinePreset(timeLocal) {
      if (!timeLocal) return '';

      const target = timeLocalToDate(timeLocal);
      if (!target) return '';

      const diffMs = target.getTime() - Date.now();

      for (const [preset, minutes] of Object.entries(DEADLINE_PRESETS)) {
        if (Math.abs(diffMs - minutes * 60 * 1000) < 60000) {
          return preset;
        }
      }

      return '';
    }

    function syncDeadlinePresetHighlight(activePreset) {
      document.querySelectorAll('.deadline-preset-btn').forEach(btn => {
        btn.classList.toggle(
          'active',
          btn.dataset.deadlinePreset === activePreset
        );
      });
    }

    function updateDeadlinePreview() {
      const preview = document.getElementById('deadline-preview');
      const timeLocal = document.getElementById('set-deadline').value;

      if (!timeLocal) {
        preview.textContent = '未設定';
        preview.classList.add('muted');
        return;
      }

      const target = timeLocalToDate(timeLocal);
      let text = timeLocal + ' 截止';

      if (target && target.getTime() <= Date.now()) {
        text += '（已過，儲存後將立即自動關閉）';
      }

      preview.textContent = text;
      preview.classList.remove('muted');
    }

    function syncDeadlineUi() {
      const timeLocal = document.getElementById('set-deadline').value;
      syncDeadlinePresetHighlight(findMatchingDeadlinePreset(timeLocal));
      updateDeadlinePreview();
    }

    function applyDeadlinePreset(preset) {
      const input = document.getElementById('set-deadline');

      if (preset === 'clear') {
        input.value = '';
        syncDeadlineUi();
        return;
      }

      const minutes = DEADLINE_PRESETS[preset];
      if (!minutes) return;

      const target = new Date(Date.now() + minutes * 60 * 1000);
      input.value = toTimeLocalValue(target);
      syncDeadlineUi();
    }

    function showLoginAlert(message) {
      const el = document.getElementById('login-alert');
      el.textContent = message;
      el.classList.remove('hidden');
    }

    function hideLoginAlert() {
      document.getElementById('login-alert').classList.add('hidden');
    }

    function hideBoot() {
      document.getElementById('boot-view').classList.add('hidden');
    }

    function showLogin() {
      hideBoot();
      document.getElementById('app-view').classList.add('hidden');
      document.getElementById('login-view').classList.remove('hidden');
    }

    function showApp() {
      hideBoot();
      document.getElementById('login-view').classList.add('hidden');
      document.getElementById('app-view').classList.remove('hidden');
      document.getElementById('user-info').textContent =
        session ? (session.operator + '｜' + session.role) : '';
      showDashboardLoading();
    }

    function showDashboardLoading() {
      document.getElementById('dashboard-loading').classList.remove('hidden');
      document.getElementById('create-section').classList.add('hidden');
      document.getElementById('manage-section').classList.add('hidden');
    }

    function hideDashboardLoading() {
      document.getElementById('dashboard-loading').classList.add('hidden');
    }

    function forceRelogin(message) {
      stopStatusPolling();
      setAdminToken('');
      session = null;
      dashboard = null;
      dashboardReady = false;
      showLogin();
      if (message) showLoginAlert(message);
    }

    function post(action, body) {
      const payload = Object.assign({}, body || {});
      if (action.indexOf('admin.') === 0 && action !== 'admin.login') {
        payload.token = getAdminToken();
      }
      const run = function () {
        return new Promise(function (resolve, reject) {
          google.script.run
            .withSuccessHandler(function (res) {
              if (res && res.error &&
                  (res.error.code === 'SESSION_EXPIRED' || res.error.code === 'FORBIDDEN')) {
                forceRelogin(res.error.message || 'Session 已失效，請重新登入');
              }
              resolve(res);
            })
            .withFailureHandler(function (err) {
              reject(err);
            })
            .apiCall(action, payload);
        });
      };
      const result = postQueue.then(run, run);
      postQueue = result.catch(function () {});
      return result;
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(el => el.classList.toggle('active', el.dataset.tab === tab));
      ['registration', 'lottery', 'display', 'system', 'data'].forEach(name => {
        document.getElementById('panel-' + name).classList.toggle('hidden', name !== tab);
      });
      if (tab === 'registration' && dashboardReady) {
        refreshRegistrationStatus();
      }
    }

    document.querySelectorAll('.tab').forEach(btn => btn.addEventListener('click', () => switchTab(btn.dataset.tab)));

    function applyRegistrationStatus(state) {
      if (!state) return;
      document.getElementById('reg-status').textContent =
        state.registration_enabled ? '開放' : '關閉';
      document.getElementById('qr-status').textContent =
        state.qr_visible ? '顯示' : '隱藏';
      if (state.waitlist_count != null) {
        document.getElementById('reg-count').textContent = state.waitlist_count;
      }
      if (dashboard && dashboard.settings) {
        dashboard.settings.registration_enabled = !!state.registration_enabled;
        dashboard.settings.qr_visible = !!state.qr_visible;
        dashboard.settings.display_mode = state.display_mode || dashboard.settings.display_mode;
      }
    }

    async function refreshRegistrationStatus() {
      const manageVisible = !document.getElementById('manage-section').classList.contains('hidden');
      if (!manageVisible || !dashboardReady) return;
      try {
        const res = await post('getPublicState');
        if (res.ok) applyRegistrationStatus(res.data);
      } catch (e) {
        // 背景輪詢失敗時不打擾操作
      }
    }

    function startStatusPolling() {
      stopStatusPolling();
      statusPollTimer = setInterval(refreshRegistrationStatus, STATUS_POLL_MS);
    }

    function stopStatusPolling() {
      if (statusPollTimer) {
        clearInterval(statusPollTimer);
        statusPollTimer = null;
      }
    }

    async function loadDashboard() {
      if (!dashboardReady) {
        showDashboardLoading();
      }
      const res = await post('admin.getDashboard');
      if (!res.ok) {
        hideDashboardLoading();
        if (res.error && res.error.code !== 'SESSION_EXPIRED') {
          alert(res.error.message || '載入失敗');
        }
        return;
      }
      dashboard = res.data;
      dashboardReady = true;
      renderDashboard();
    }

    function showCreateOnly() {
      stopStatusPolling();
      document.getElementById('create-section').classList.remove('hidden');
      document.getElementById('manage-section').classList.add('hidden');
      document.getElementById('new-event-name').value = getDefaultEventName();
      document.getElementById('new-session-name').value = getDefaultSessionName();
    }

    function showManage() {
      document.getElementById('create-section').classList.add('hidden');
      document.getElementById('manage-section').classList.remove('hidden');
      startStatusPolling();
    }

    function renderDashboard() {
      hideDashboardLoading();
      const s = dashboard.settings;
      if (!dashboard.has_active_event) {
        showCreateOnly();
        return;
      }
      showManage();

      const label = [s.event_name, s.session_name].filter(Boolean).join('｜');
      document.getElementById('current-event-label').textContent = '目前場次：' + (label || '-');

      document.getElementById('reg-status').textContent = s.registration_enabled ? '開放' : '關閉';
      document.getElementById('qr-status').textContent = s.qr_visible ? '顯示' : '隱藏';
      document.getElementById('reg-count').textContent = dashboard.waitlist_count;
      document.getElementById('admin-urls').innerHTML =
        'Display: <a href="' + dashboard.urls.display + '" target="_blank">開啟</a>｜' +
        'Candidate: <a href="' + dashboard.urls.candidate + '" target="_blank">開啟</a>';

      const tbody = document.getElementById('waitlist-body');
      tbody.innerHTML = '';
      dashboard.waitlist.forEach(row => {
        const tr = document.createElement('tr');

        const tdNo = document.createElement('td');
        tdNo.textContent = row.waitlist_no || '';

        const tdName = document.createElement('td');
        tdName.textContent = row.name || '';

        const tdPhone = document.createElement('td');
        tdPhone.textContent = row.phone_masked || '';

        const tdTime = document.createElement('td');
        tdTime.textContent = row.registered_at || '';

        const tdFlags = document.createElement('td');

        (row.duplicate_flags || '')
          .split(',')
          .filter(Boolean)
          .forEach(function (flag) {
            const badge = document.createElement('span');

            badge.className =
              'badge ' +
              (
                flag === 'same_phone' || flag === 'same_name'
                  ? 'badge-warn'
                  : 'badge-ok'
              );

            badge.textContent =
              flag === 'same_phone'
                ? '相同電話'
                : flag === 'same_name'
                  ? '同名'
                  : flag;

            tdFlags.appendChild(badge);
            tdFlags.appendChild(document.createTextNode(' '));
          });

        tr.appendChild(tdNo);
        tr.appendChild(tdName);
        tr.appendChild(tdPhone);
        tr.appendChild(tdTime);
        tr.appendChild(tdFlags);

        tbody.appendChild(tr);
      });

      document.getElementById('set-event-name').value = s.event_name || getDefaultEventName();
      document.getElementById('set-session-name').value = s.session_name || getDefaultSessionName();

      document.getElementById('set-deadline').value = deadlineToTimeLocal(s.deadline);
      syncDeadlineUi();

      document.getElementById('set-show-deadline').checked =
        !!s.show_deadline;

      document.getElementById('set-auto-close-deadline').checked =
        !!s.auto_close_deadline;

      document.getElementById('set-show-waitlist-count').checked =
        !!s.show_waitlist_count;

      document.getElementById('set-display-title').value =
        s.display_title || '';

      document.getElementById('set-display-subtitle').value =
        s.display_subtitle || '';

      document.getElementById('set-mode').value = s.mode || 'general';
      document.getElementById('set-qr-rotation').checked = !!s.qr_rotation;
      document.getElementById('set-show-qr-countdown').checked =
        !!s.show_qr_countdown;
      document.getElementById('set-qr-interval').value = s.qr_rotation_interval || 20;
      document.getElementById('set-token-ttl').value = s.token_ttl || 40;
      document.getElementById('set-form-ttl').value = s.form_session_ttl || 70;
      document.getElementById('set-pin-max-attempts').value = s.pin_max_attempts || 3;
      document.getElementById('set-pin-lockout-seconds').value = s.pin_lockout_seconds || 30;
      document.getElementById('set-staff-pin-hint').textContent =
        '預設 PIN：' + (dashboard.default_staff_pin || '0313') + '（首次初始化時使用；留空則不修改現有 PIN）';
      document.getElementById('first-batch-count').value = s.lottery_first_batch_count || 60;
      document.getElementById('lottery-status').textContent =
        '抽選狀態：' + (s.lottery_locked ? '已完成（不可重抽）' : '尚未抽選');
      document.getElementById('set-lottery-sort-asc').checked = s.lottery_sort_asc !== false;
      document.getElementById('set-show-random-rank').checked = !!s.show_random_rank;
      document.getElementById('set-show-page-number').checked = !!s.show_page_number;
      document.getElementById('set-results-per-page').value = s.results_per_page || 16;
      document.getElementById('set-results-columns').value = s.results_columns || '';
      document.getElementById('set-carousel-seconds').value = s.carousel_seconds || 5;

      const lotteryLocked = !!s.lottery_locked;
      document.getElementById('btn-run-lottery').disabled = lotteryLocked;
      document.getElementById('first-batch-count').disabled = lotteryLocked;
      document.getElementById('lottery-exclude').disabled = lotteryLocked;
      document.getElementById('lottery-include').disabled = lotteryLocked;
      document.getElementById('btn-add-batch').disabled = !lotteryLocked;

      const batchList = document.getElementById('batch-list');
      batchList.innerHTML = '';
      (dashboard.publish_batches || []).forEach(batch => {
        const div = document.createElement('div');
        div.style.marginBottom = '8px';
        div.innerHTML = 'Batch ' + batch.batch_no + '：rank ' + batch.rank_start + '-' + batch.rank_end +
          '（' + batch.display_title + '）' +
          ' <button class="btn btn-secondary" data-batch="' + batch.batch_id + '">顯示到 Display</button>';
        batchList.appendChild(div);
      });
      batchList.querySelectorAll('[data-batch]').forEach(btn => {
        btn.addEventListener('click', () => {
          UI.runWithLoading(btn, '切換中…', async () => {
            await post('admin.setDisplayedBatch', { batch_id: btn.dataset.batch });
            alert('已切換 Display 批次');
          });
        });
      });
    }

    document.querySelectorAll('[data-quick]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.disabled) return;
        const actionLabel = btn.textContent.trim();
        const nextState = btn.dataset.quick;
        if (!confirm('確定要切換為「' + actionLabel + '」？')) return;
        UI.runWithLoading(btn, '切換中…', async () => {
          stopStatusPolling();
          try {
            const res = await post('admin.setQuickState', { state: nextState });
            if (!res.ok) {
              alert(res.error?.message || '切換失敗');
              return;
            }
            if (dashboard && res.data) {
              Object.assign(dashboard.settings, res.data);
            }
            applyRegistrationStatus(res.data);
          } catch (err) {
            alert((err && err.message) || '無法連線伺服器，請稍後再試');
          } finally {
            if (dashboardReady && !document.getElementById('manage-section').classList.contains('hidden')) {
              startStatusPolling();
            }
          }
        });
      });
    });

    document.getElementById('btn-run-lottery').addEventListener('click', () => {
      const btn = document.getElementById('btn-run-lottery');
      if (btn.disabled) return;
      const exclude = parseWaitlistNos(document.getElementById('lottery-exclude').value);
      const include = parseWaitlistNos(document.getElementById('lottery-include').value);
      let confirmMsg = '確定執行首次抽選？此操作不可直接重抽。';
      if (exclude.length) confirmMsg += '\n\n排除序號：' + exclude.join(', ');
      if (include.length) confirmMsg += '\n必中首輪：' + include.join(', ');
      if (!confirm(confirmMsg)) return;
      UI.runWithLoading(btn, '抽選中…', async () => {
        const count = Number(document.getElementById('first-batch-count').value);
        const res = await post('admin.runInitialLottery', {
          first_batch_count: count,
          advanced_rules: { exclude, include }
        });
        alert(res.ok ? '抽選完成' : (res.error?.message || '失敗'));
        if (res.ok) {
          document.getElementById('lottery-exclude').value = '';
          document.getElementById('lottery-include').value = '';
        }
        await loadDashboard();
      });
    });

    document.getElementById('btn-add-batch').addEventListener('click', () => {
      const btn = document.getElementById('btn-add-batch');
      if (btn.disabled) return;
      UI.runWithLoading(btn, '建立中…', async () => {
        const count = Number(document.getElementById('next-batch-count').value);
        const displayTitle = document.getElementById('next-batch-title').value.trim();
        const payload = { count };
        if (displayTitle) payload.display_title = displayTitle;
        const res = await post('admin.createPublishBatch', payload);
        alert(res.ok ? '已建立下一批' : (res.error?.message || '失敗'));
        if (res.ok) document.getElementById('next-batch-title').value = '';
        await loadDashboard();
      });
    });

    document.getElementById('btn-save-lottery-display').addEventListener('click', () => {
      const btn = document.getElementById('btn-save-lottery-display');
      if (btn.disabled) return;
      UI.runWithLoading(btn, '儲存中…', async () => {
        const cols = document.getElementById('set-results-columns').value;
        await post('admin.updateSettings', { settings: {
          lottery_sort_asc: document.getElementById('set-lottery-sort-asc').checked,
          show_random_rank: document.getElementById('set-show-random-rank').checked,
          show_page_number: document.getElementById('set-show-page-number').checked,
          results_per_page: Number(document.getElementById('set-results-per-page').value),
          results_columns: cols ? Number(cols) : '',
          carousel_seconds: Number(document.getElementById('set-carousel-seconds').value),
          lottery_first_batch_count: Number(document.getElementById('first-batch-count').value)
        }});
        await loadDashboard();
        alert('已儲存');
      });
    });



    document.getElementById('btn-save-display').addEventListener('click', () => {
      const btn = document.getElementById('btn-save-display');

      if (btn.disabled) return;

      UI.runWithLoading(btn, '儲存中…', async () => {
        const deadlineTime = document.getElementById('set-deadline').value;

        const showDeadline =
          document.getElementById('set-show-deadline').checked;

        const autoCloseDeadline =
          document.getElementById('set-auto-close-deadline').checked;

        let deadline = '';

        if (deadlineTime) {
          deadline = timeLocalToDeadlineIso(deadlineTime);

          if (!deadline) {
            alert('截止時間格式錯誤');
            return;
          }
        }

        if (autoCloseDeadline && !deadline) {
          alert('啟用自動關閉候補時，必須設定截止時間');
          return;
        }

        const res = await post('admin.updateSettings', {
          settings: {
            event_name:
              document.getElementById('set-event-name').value,

            session_name:
              document.getElementById('set-session-name').value,

            deadline: deadline,

            show_deadline: showDeadline,

            auto_close_deadline: autoCloseDeadline,

            show_waitlist_count:
              document.getElementById('set-show-waitlist-count').checked,

            display_title:
              document.getElementById('set-display-title').value,

            display_subtitle:
              document.getElementById('set-display-subtitle').value
          }
        });

        if (!res.ok) {
          alert(res.error?.message || '儲存失敗');
          return;
        }

        await loadDashboard();

        alert('已儲存');
      });
    });



    document.getElementById('btn-save-system').addEventListener('click', () => {
      const btn = document.getElementById('btn-save-system');
      if (btn.disabled) return;
      UI.runWithLoading(btn, '儲存中…', async () => {
        const settings = {
          mode: document.getElementById('set-mode').value,
          qr_rotation: document.getElementById('set-qr-rotation').checked,
          show_qr_countdown:
            document.getElementById('set-show-qr-countdown').checked,
          qr_rotation_interval: Number(document.getElementById('set-qr-interval').value),
          token_ttl: Number(document.getElementById('set-token-ttl').value),
          form_session_ttl: Number(document.getElementById('set-form-ttl').value),
          pin_max_attempts: Number(document.getElementById('set-pin-max-attempts').value),
          pin_lockout_seconds: Number(document.getElementById('set-pin-lockout-seconds').value),
          lottery_first_batch_count: Number(document.getElementById('first-batch-count').value)
        };
        const pin = document.getElementById('set-staff-pin').value;
        if (pin) settings.staff_pin = pin;
        await post('admin.updateSettings', { settings });
        await loadDashboard();
        alert('已儲存');
      });
    });

    document.querySelectorAll('[data-export]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.disabled) return;
        UI.runWithLoading(btn, '匯出中…', async () => {
          const res = await post('admin.export', { type: btn.dataset.export });
          if (res.ok) {
            document.getElementById('data-message').innerHTML = '匯出完成：<a href="' + res.data.spreadsheet_url + '" target="_blank">開啟試算表</a>';
          } else {
            alert(res.error?.message || '匯出失敗');
          }
        });
      });
    });

    document.getElementById('btn-create-event').addEventListener('click', () => {
      const btn = document.getElementById('btn-create-event');
      if (btn.disabled) return;
      const eventName = document.getElementById('new-event-name').value.trim();
      const sessionName = document.getElementById('new-session-name').value.trim();
      if (!eventName) {
        alert('請輸入活動名稱');
        return;
      }
      UI.runWithLoading(btn, '建立中…', async () => {
        const res = await post('admin.createEvent', {
          event_name: eventName,
          session_name: sessionName
        });
        if (!res.ok) {
          alert(res.error?.message || '建立失敗');
          return;
        }
        await loadDashboard();
      });
    });

    document.getElementById('btn-archive').addEventListener('click', () => {
      const btn = document.getElementById('btn-archive');
      if (btn.disabled) return;
      if (!confirm(
        '確定結束並封存本場次？\n\n' +
        '系統將先複製整份試算表作為備份，然後刪除工作試算表中的候補／抽選／稽核資料，' +
        '並回到建立新場次畫面。此操作無法復原（僅備份檔保留資料）。'
      )) return;
      UI.runWithLoading(btn, '封存中…', async () => {
        const res = await post('admin.archiveEvent');
        if (!res.ok) {
          alert(res.error?.message || '封存失敗');
          return;
        }
        if (res.data?.export_url) {
          try { window.open(res.data.export_url, '_blank'); } catch (e) { /* popup blocked */ }
        }
        let msg = '場次已備份並清空工作資料';
        if (res.data?.export_name) msg += '。備份：' + res.data.export_name;
        document.getElementById('data-message').textContent = msg;
        await loadDashboard();
      });
    });

    async function doLogin() {
      const btn = document.getElementById('btn-login');
      if (btn.disabled) return;
      UI.setButtonLoading(btn, true, '登入中…');
      try {
        const res = await post('admin.login', {
          pin: document.getElementById('admin-pin').value,
          operator_name: document.getElementById('operator-name').value,
          source_id: getSourceId()
        });
        if (!res || !res.ok) {
          showLoginAlert((res && res.error && res.error.message) || '登入失敗');
          return;
        }
        setAdminToken(res.data.token);
        session = {
          role: res.data.role,
          operator: res.data.operator,
          expiresAt: res.data.expiresAt
        };
        hideLoginAlert();
        showApp();
        await loadDashboard();
      } catch (err) {
        showLoginAlert((err && err.message) || '無法連線伺服器，請確認已部署 Web App 並重新整理');
      } finally {
        UI.setButtonLoading(btn, false);
      }
    }

    async function doLogout() {
      await post('admin.logout', { token: getAdminToken() });
      setAdminToken('');
      session = null;
      location.reload();
    }

    async function bootApp() {
      try {
        const token = getAdminToken();
        if (!token) {
          showLogin();
          return;
        }

        const res = await post('admin.checkSession', { token });
        if (!res || !res.ok || !res.data.session) {
          setAdminToken('');
          showLogin();
          if (res && res.error && res.error.message) showLoginAlert(res.error.message);
          return;
        }

        session = res.data.session;
        showApp();
        await loadDashboard();
      } catch (err) {
        showLogin();
        showLoginAlert((err && err.message) || '無法連線伺服器，請確認已部署 Web App');
      }
    }

    document.getElementById('btn-login').addEventListener('click', doLogin);
    document.getElementById('btn-logout').addEventListener('click', doLogout);
    document.getElementById('admin-pin').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });
    document.getElementById('operator-name').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });

    document.querySelectorAll('[data-deadline-preset]').forEach(btn => {
      btn.addEventListener('click', () => {
        applyDeadlinePreset(btn.dataset.deadlinePreset);
      });
    });
    document.getElementById('set-deadline').addEventListener('input', syncDeadlineUi);
    document.getElementById('set-deadline').addEventListener('change', syncDeadlineUi);

    bootApp();
  </script>
</body>
</html>
