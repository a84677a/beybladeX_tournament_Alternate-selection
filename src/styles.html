<style>
  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --text: #f8fafc;
    --muted: #94a3b8;
    --primary: #38bdf8;
    --success: #22c55e;
    --success-bg: #14532d;
    --warning: #f97316;
    --warning-bg: #7c2d12;
    --danger: #ef4444;
    --border: #334155;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Segoe UI", "Noto Sans TC", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .container {
    width: min(1200px, 100%);
    margin: 0 auto;
    padding: 24px;
  }

  h1, h2, h3 { margin: 0 0 12px; }

  .muted { color: var(--muted); }

  .admin-url-dev-link {
    color: var(--warning);
    font-size: 14px;
  }

  .session-bar {
    margin-bottom: 16px;
    padding: 16px 20px;
  }

  .session-bar-main {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .session-bar-info {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
    flex: 1;
  }

  .session-bar-label {
    font-size: 13px;
    letter-spacing: 0.02em;
  }

  .session-bar-title {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.35;
    word-break: break-word;
  }

  .session-display-btn {
    min-height: 44px;
    padding: 10px 18px;
    font-size: 15px;
    white-space: nowrap;
  }

  .session-bar-dev {
    margin-top: 14px;
  }

  .session-bar-dev .lottery-details-body {
    margin-top: 12px;
    padding-top: 12px;
  }

  .session-bar-dev-action {
    margin: 10px 0 0;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    padding: 12px 20px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }

  .btn-primary { background: var(--primary); color: #0f172a; }
  .btn-secondary { background: #334155; color: var(--text); }
  .btn-danger { background: var(--danger); color: white; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  a.btn { text-decoration: none; }

  .btn.is-active {
    box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--primary);
  }

  .btn-danger.is-active {
    box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--danger);
  }

  .btn-block { width: 100%; }

  .btn-spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    margin-right: 7px;
    border: 2px solid currentColor;
    border-right-color: transparent;
    border-radius: 50%;
    vertical-align: -2px;
    animation: btn-spin 0.7s linear infinite;
  }

  @keyframes btn-spin {
    to { transform: rotate(360deg); }
  }

  button.is-loading,
  .btn.is-loading {
    cursor: wait;
    opacity: 0.75;
    pointer-events: none;
  }

  .app-overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(15, 23, 42, 0.72);
    backdrop-filter: blur(2px);
  }

  .app-overlay-box {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 18px 22px;
    border-radius: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    font-weight: 600;
  }

  .app-overlay-box .btn-spinner {
    width: 18px;
    height: 18px;
    margin-right: 0;
  }

  .app-toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%);
    z-index: 1001;
    max-width: min(92vw, 420px);
    padding: 14px 18px;
    border-radius: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    text-align: center;
    font-weight: 600;
  }

  .app-toast-success {
    border-color: var(--success);
    color: var(--success);
  }

  .app-toast-error {
    border-color: var(--danger);
    color: #fca5a5;
  }

  .field { margin-bottom: 16px; }
  .field label { display: block; margin-bottom: 8px; font-weight: 600; }
  .field-switch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    min-height: 48px;
  }
  .field-switch > label:first-child {
    margin-bottom: 0;
    flex: 1;
  }
  .switch {
    position: relative;
    display: inline-flex;
    align-items: center;
    flex-shrink: 0;
    cursor: pointer;
  }
  .switch input {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
  }
  .switch-slider {
    position: relative;
    display: inline-block;
    width: 52px;
    height: 28px;
    border-radius: 999px;
    background: #334155;
    transition: background 0.2s ease;
  }
  .switch-slider::before {
    content: '';
    position: absolute;
    top: 3px;
    left: 3px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--text);
    transition: transform 0.2s ease;
  }
  .switch input:checked + .switch-slider {
    background: var(--primary);
  }
  .switch input:checked + .switch-slider::before {
    transform: translateX(24px);
  }
  .switch input:focus-visible + .switch-slider {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
  }
  .field input:not([type="checkbox"]), .field select, .field textarea {
    width: 100%;
    min-height: 48px;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #0b1220;
    color: var(--text);
    font-size: 16px;
  }
  .field input[type="date"],
  .field input[type="time"],
  .field input[type="datetime-local"] {
    color-scheme: dark;
  }
  .display-form {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .display-form .field {
    margin-bottom: 0;
  }
  .deadline-panel {
    padding: 16px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #0b1220;
  }
  .deadline-panel-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }
  .deadline-panel-title {
    font-weight: 600;
  }
  .deadline-presets {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
  }
  .deadline-preset-btn {
    min-height: 40px;
    padding: 6px 8px;
    font-size: 14px;
  }
  .deadline-preset-btn.active {
    background: var(--primary);
    color: #0f172a;
  }
  .deadline-toolbar {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-top: 10px;
  }
  .deadline-toolbar input[type="time"] {
    flex: 1;
    min-width: 0;
    min-height: 44px;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 16px;
  }
  .deadline-clear-btn {
    min-height: 44px;
    padding: 8px 14px;
    font-size: 14px;
    white-space: nowrap;
  }
  .deadline-switches {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 8px 16px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .deadline-switches .field-switch {
    min-height: auto;
  }
  .deadline-preview {
    font-size: 14px;
    font-weight: 600;
    text-align: right;
  }
  .deadline-preview:not(.muted) {
    color: var(--primary);
  }
  .field .switch input[type="checkbox"] {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
    min-height: 0;
    padding: 0;
    border: none;
    background: transparent;
  }

  .grid-2 {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 24px;
  }

  .success-screen {
    background: var(--success-bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .success-card {

  .success-no {

  }

  .warning-screen {

  }

  }

  .tab {

  .tab:hover:not(.active) { background: #3f4f66; }

  .table th, .table td {

  }

  .table th {

  .table-wrap {

  .table-wrap .table th:first-child,

  .table-empty {

  }

  .panel-header {
    margin-bottom: 20px;
  }

  .panel-header h2 {
    margin-bottom: 12px;
  }

  .status-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .status-chip {

    align-items: center;
    gap: 8px;

  }

  .status-chip-label {

  }

  .status-chip-value {

  }

  .status-chip-value.is-on { color: var(--success); }
  .status-chip-value.is-off { color: var(--danger); }

  .status-chip-count .status-chip-value {

  }

  .admin-section {

  }

  .admin-section-title {

  }

    margin-bottom: 0;
  }

  .quick-actions {
    display: flex;
    flex-wrap: wrap;

  }

  .quick-actions .btn {
    min-width: 132px;
  }

    grid-template-columns: minmax(160px, 220px) minmax(0, 1fr);
    gap: 16px 20px;
    margin: 12px 0 16px;
  }

  .filter-bar .field {
    margin-bottom: 0;

  }

  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 12px;
    background: #334155;
  }

  .badge-warn { background: #92400e; }
  .badge-ok { background: #166534; }

  .waitlist-row-excluded td {

  }

  .btn-table {

  }

  .display-title {

  .display-status {

  .qr-box img {

  }

  .lottery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
    gap: 16px;

  }

  .lottery-no {
    font-size: clamp(24px, 3vw, 40px);

    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .lottery-rank {
    font-size: 0.45em;
    font-weight: 600;
    color: var(--muted);
  }

  .admin-header {

  .field-hint {

    font-size: 14px;
    line-height: 1.45;
  }

  .field-narrow input[type="number"] {

    max-width: 100%;
  }

  .lottery-header {
    margin-bottom: 20px;
  }

  .lottery-header h2 {

  }

  .lottery-status {
