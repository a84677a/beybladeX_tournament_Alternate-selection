<style>
  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --text: #f8fafc;
    --muted: #94a3b8;
    --primary: #38bdf8;
    --success: #22c55e;
    --success-bg: #14532d;
    --warning: #f97316;
    --warning-bg: #7c2d12;
    --danger: #ef4444;
    --border: #334155;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Segoe UI", "Noto Sans TC", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .container {
    width: min(1200px, 100%);
    margin: 0 auto;
    padding: 24px;
  }

  h1, h2, h3 { margin: 0 0 12px; }

  .muted { color: var(--muted); }

  .admin-url-dev-link {
    color: var(--warning);
    font-size: 14px;
  }

  .session-bar {
    margin-bottom: 16px;
    padding: 16px 20px;
  }

  .session-bar-main {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .session-bar-info {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
    flex: 1;
  }

  .session-bar-label {
    font-size: 13px;
    letter-spacing: 0.02em;
  }

  .session-bar-title {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.35;
    word-break: break-word;
  }

  .session-display-btn {
    min-height: 44px;
    padding: 10px 18px;
    font-size: 15px;
    white-space: nowrap;
  }

  .session-bar-dev {
    margin-top: 14px;
  }

  .session-bar-dev .lottery-details-body {
    margin-top: 12px;
    padding-top: 12px;
  }

  .session-bar-dev-action {
    margin: 10px 0 0;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    padding: 12px 20px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }

  .btn-primary { background: var(--primary); color: #0f172a; }
  .btn-secondary { background: #334155; color: var(--text); }
  .btn-danger { background: var(--danger); color: white; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  a.btn { text-decoration: none; }

  .btn.is-active {
    box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--primary);
  }

  .btn-danger.is-active {
    box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--danger);
  }

  .btn-block { width: 100%; }

  .btn-spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    margin-right: 7px;
    border: 2px solid currentColor;
    border-right-color: transparent;
    border-radius: 50%;
    vertical-align: -2px;
    animation: btn-spin 0.7s linear infinite;
  }

  @keyframes btn-spin {
    to { transform: rotate(360deg); }
  }

  button.is-loading,
  .btn.is-loading {
    cursor: wait;
    opacity: 0.75;
    pointer-events: none;
  }

  .app-overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(15, 23, 42, 0.72);
    backdrop-filter: blur(2px);
  }

  .app-overlay-box {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 18px 22px;
    border-radius: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    font-weight: 600;
  }

  .app-overlay-box .btn-spinner {
    width: 18px;
    height: 18px;
    margin-right: 0;
  }

  .app-toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%);
    z-index: 1001;
    max-width: min(92vw, 420px);
    padding: 14px 18px;
    border-radius: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    text-align: center;
    font-weight: 600;
  }

  .app-toast-success {
    border-color: var(--success);
    color: var(--success);
  }

  .app-toast-error {
    border-color: var(--danger);
    color: #fca5a5;
  }

  .field { margin-bottom: 16px; }
  .field label { display: block; margin-bottom: 8px; font-weight: 600; }
  .field-switch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    min-height: 48px;
  }
  .field-switch > label:first-child {
    margin-bottom: 0;
    flex: 1;
  }
  .switch {
    position: relative;
    display: inline-flex;
    align-items: center;
    flex-shrink: 0;
    cursor: pointer;
  }
  .switch input {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
  }
  .switch-slider {
    position: relative;
    display: inline-block;
    width: 52px;
    height: 28px;
    border-radius: 999px;
    background: #334155;
    transition: background 0.2s ease;
  }
  .switch-slider::before {
    content: '';
    position: absolute;
    top: 3px;
    left: 3px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--text);
    transition: transform 0.2s ease;
  }
  .switch input:checked + .switch-slider {
    background: var(--primary);
  }
  .switch input:checked + .switch-slider::before {
    transform: translateX(24px);
  }
  .switch input:focus-visible + .switch-slider {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
  }
  .field input:not([type="checkbox"]), .field select, .field textarea {
    width: 100%;
    min-height: 48px;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #0b1220;
    color: var(--text);
    font-size: 16px;
  }
  .field input[type="date"],
  .field input[type="time"],
  .field input[type="datetime-local"] {
    color-scheme: dark;
  }
  .display-form {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .display-form .field {
    margin-bottom: 0;
  }
  .deadline-panel {
    padding: 16px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #0b1220;
  }
  .deadline-panel-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }
  .deadline-panel-title {
    font-weight: 600;
  }
  .deadline-presets {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
  }
  .deadline-preset-btn {
    min-height: 40px;
    padding: 6px 8px;
    font-size: 14px;
  }
  .deadline-preset-btn.active {
    background: var(--primary);
    color: #0f172a;
  }
  .deadline-toolbar {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-top: 10px;
  }
  .deadline-toolbar input[type="time"] {
    flex: 1;
    min-width: 0;
    min-height: 44px;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 16px;
  }
  .deadline-clear-btn {
    min-height: 44px;
    padding: 8px 14px;
    font-size: 14px;
    white-space: nowrap;
  }
  .deadline-switches {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 8px 16px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .deadline-switches .field-switch {
    min-height: auto;
  }
  .deadline-preview {
    font-size: 14px;
    font-weight: 600;
    text-align: right;
  }
  .deadline-preview:not(.muted) {
    color: var(--primary);
  }
  .field .switch input[type="checkbox"] {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
    min-height: 0;
    padding: 0;
    border: none;
    background: transparent;
  }

  .grid-2 {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 24px;
  }

  .success-screen {
    background: var(--success-bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .success-card {
    text-align: center;
    width: min(480px, 100%);
  }

  .success-no {
    font-size: clamp(48px, 12vw, 96px);
    font-weight: 800;
    color: var(--success);
    line-height: 1;
    margin: 16px 0;
  }

  .warning-screen {
    background: var(--warning-bg);
    min-height: 100vh;
    padding: 24px;
  }

  .tabs-sticky {
    position: sticky;
    top: 0;
    z-index: 20;
    margin: 0 0 20px;
    padding: 12px 0 16px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }

  .tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .tab {
    padding: 10px 16px;
    border-radius: 999px;
    background: #334155;
    color: var(--text);
    border: none;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .tab:hover:not(.active) { background: #3f4f66; }
  .tab.active { background: var(--primary); color: #0f172a; }

  .table {
    width: 100%;
    border-collapse: collapse;
  }

  .table th, .table td {
    border-bottom: 1px solid var(--border);
    padding: 10px 8px;
    text-align: left;
    font-size: 14px;
  }

  .table th {
    position: sticky;
    top: 0;
    background: var(--surface);
    z-index: 1;
    font-weight: 600;
    color: var(--muted);
  }

  .table-wrap {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #0b1220;
  }

  .table-wrap .table {
    margin: 0;
  }

  .table-wrap .table th:first-child,
  .table-wrap .table td:first-child {
    padding-left: 14px;
  }

  .table-wrap .table th:last-child,
  .table-wrap .table td:last-child {
    padding-right: 14px;
  }

  .table-empty {
    text-align: center;
    padding: 28px 16px !important;
    font-size: 15px;
  }

  .panel-header {
    margin-bottom: 20px;
  }

  .panel-header h2 {
    margin-bottom: 12px;
  }

  .status-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .status-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: #0b1220;
    font-size: 14px;
  }

  .status-chip-label {
    color: var(--muted);
    font-weight: 600;
  }

  .status-chip-value {
    font-weight: 700;
  }

  .status-chip-value.is-on { color: var(--success); }
  .status-chip-value.is-off { color: var(--danger); }
  .status-chip-value.is-muted { color: var(--muted); }

  .status-chip-count .status-chip-value.is-cap-full {
    color: var(--danger);
  }

  .status-chip-count .status-chip-value {
    font-size: 16px;
    color: var(--primary);
  }

  .admin-section {
    padding: 20px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #0b1220;
    margin-bottom: 20px;
  }

  .admin-section:last-child {
    margin-bottom: 0;
  }

  .admin-section-title {
    margin: 0 0 16px;
    font-size: 15px;
    font-weight: 700;
    color: var(--primary);
    letter-spacing: 0.02em;
  }

  .admin-section .field:last-child {
    margin-bottom: 0;
  }

  .quick-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .quick-actions .btn {
    min-width: 132px;
  }

  .filter-bar {
    display: grid;
    grid-template-columns: minmax(160px, 220px) minmax(0, 1fr);
    gap: 16px 20px;
    margin: 12px 0 16px;
  }

  .filter-bar .field {
    margin-bottom: 0;
  }

  #published-lottery-summary {
    margin: 0 0 4px;
    font-size: 14px;
  }

  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 12px;
    background: #334155;
  }

  .badge-warn { background: #92400e; }
  .badge-ok { background: #166534; }
  .badge-published { background: #1e3a5f; color: var(--primary); }
  .badge-excluded { background: #7f1d1d; color: #fecaca; }

  .waitlist-row-excluded td {
    opacity: 0.72;
  }

  .btn-table {
    min-width: 0;
    padding: 4px 10px;
    font-size: 12px;
  }

  .display-title {
    font-size: clamp(28px, 4vw, 56px);
    font-weight: 800;
    text-align: center;
  }

  .display-status {
    font-size: clamp(24px, 3vw, 40px);
    text-align: center;
    margin: 12px 0 24px;
    color: var(--primary);
  }

  .display-info-card {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .display-info-card h3 {
    margin: 0;
  }

  .display-image-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top: 4px;
  }

  .display-image {
    width: 100%;
    max-height: min(360px, 40vh);
    object-fit: contain;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.04);
  }

  .display-stats {
    display: flex;
    gap: 16px;
    margin-top: 4px;
  }

  .display-stats-single .display-stat {
    flex: 1;
  }

  .display-stat {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 20px 16px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.06);
    text-align: center;
  }

  .display-stat-label {
    font-size: clamp(14px, 1.6vw, 18px);
    color: var(--muted);
    font-weight: 600;
  }

  .display-stat-value {
    font-size: clamp(36px, 5vw, 64px);
    font-weight: 800;
    color: var(--primary);
    line-height: 1.1;
  }

  /* Display 投影頁：固定 100vh，避免內容被裁切 */
  body.display-page {
    height: 100vh;
    overflow: hidden;
  }

  body.display-page .display-container {
    width: min(1500px, 96vw);
    height: 100vh;
    max-height: 100vh;
    padding: clamp(10px, 1.8vh, 20px) clamp(12px, 2vw, 28px);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  body.display-page .display-screen {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  body.display-page .display-header {
    flex-shrink: 0;
    text-align: center;
    padding: clamp(12px, 2vh, 22px) clamp(16px, 3vw, 32px);
    margin-bottom: clamp(8px, 1.2vh, 14px);
    border-radius: 18px;
    background: linear-gradient(
      180deg,
      rgba(56, 189, 248, 0.18) 0%,
      rgba(56, 189, 248, 0.05) 100%
    );
    border: 2px solid rgba(56, 189, 248, 0.35);
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.22);
  }

  body.display-page .display-title {
    font-size: clamp(34px, 6.5vh, 88px);
    line-height: 1.08;
    font-weight: 900;
    letter-spacing: 0.04em;
    text-shadow: 0 2px 20px rgba(56, 189, 248, 0.28);
    margin: 0;
  }

  body.display-page .display-header .display-status {
    font-size: clamp(22px, 3.6vh, 48px);
    font-weight: 700;
    margin: clamp(8px, 1.2vh, 14px) 0 0;
    color: var(--primary);
  }

  body.display-page .display-status {
    font-size: clamp(18px, 2.8vh, 34px);
    margin: clamp(4px, 0.8vh, 10px) 0 clamp(8px, 1.4vh, 16px);
    flex-shrink: 0;
  }

  body.display-page .display-grid {
    flex: 1;
    min-height: 0;
    gap: clamp(10px, 1.8vh, 20px);
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    align-items: stretch;
  }

  body.display-page .display-grid > .card {
    min-height: 0;
    overflow: hidden;
    padding: clamp(12px, 2vh, 20px);
    margin: 0;
  }

  body.display-page .display-qr-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: stretch;
    gap: clamp(6px, 1vh, 10px);
  }

  body.display-page .display-qr-hint {
    text-align: center;
    margin: 0;
    font-size: clamp(16px, 2.4vh, 28px);
    line-height: 1.4;
    font-weight: 600;
    flex-shrink: 0;
  }

  body.display-page .display-info-card {
    flex: 1;
    min-height: 0;
    gap: clamp(6px, 1vh, 12px);
  }

  body.display-page .display-info-card h3 {
    font-size: clamp(20px, 3.2vh, 40px);
    font-weight: 800;
    flex-shrink: 0;
  }

  body.display-page .display-info-card #display-subtitle {
    margin: 0;
    font-size: clamp(16px, 2.5vh, 30px);
    line-height: 1.45;
    font-weight: 500;
    flex-shrink: 0;
  }

  body.display-page .display-image-wrap {
    flex: 1;
    min-height: 0;
    margin: 0;
    overflow: hidden;
  }

  body.display-page .display-image {
    width: auto;
    max-width: 100%;
    height: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  body.display-page .display-stats {
    flex-shrink: 0;
    margin-top: auto;
    gap: clamp(12px, 2vh, 20px);
  }

  body.display-page .display-stat {
    padding: clamp(14px, 2.4vh, 28px) clamp(12px, 2vw, 20px);
    gap: clamp(6px, 1vh, 12px);
  }

  body.display-page .display-stat-label {
    font-size: clamp(18px, 3vh, 36px);
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  body.display-page .display-stat-value {
    font-size: clamp(44px, 8.5vh, 104px);
    font-weight: 800;
    line-height: 1;
  }

  /* 無投影圖片時：放大說明與 stat，填滿右側卡片 */
  body.display-page .display-info-card-no-image #display-subtitle {
    text-align: center;
    font-size: clamp(18px, 3vh, 36px);
    line-height: 1.5;
    padding: clamp(4px, 1vh, 12px) clamp(8px, 1.5vw, 16px);
  }

  body.display-page .display-info-card-no-image .display-stats {
    flex: 1;
    min-height: 0;
    margin-top: clamp(8px, 1.5vh, 16px);
    align-items: stretch;
  }

  body.display-page .display-info-card-no-image .display-stat {
    justify-content: center;
    min-height: clamp(100px, 20vh, 260px);
    padding: clamp(18px, 3vh, 36px) clamp(14px, 2vw, 24px);
  }

  body.display-page .display-info-card-no-image .display-stat-value {
    font-size: clamp(52px, 10vh, 128px);
  }

  body.display-page .display-info-card-no-image.display-info-card-no-stats #display-subtitle {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(20px, 3.8vh, 44px);
    padding: clamp(16px, 3vh, 32px);
  }

  body.display-page .display-info-card-no-image.display-info-card-no-stats h3 {
    text-align: center;
  }

  body.display-page .qr-box {
    flex: 1 1 0;
    min-height: 0;
    width: 100%;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  body.display-page .qr-box #qr-code {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
  }

  body.display-page .qr-box img {
    display: block;
    width: min(100%, 52vh);
    height: min(100%, 52vh);
    max-width: min(100%, 52vh);
    max-height: min(100%, 52vh);
    aspect-ratio: 1;
    object-fit: contain;
    margin: 0 auto;
    padding: clamp(6px, 1vh, 10px);
    border-radius: 12px;
  }

  @media (max-height: 720px) {
    body.display-page .display-title {
      font-size: clamp(28px, 5vh, 56px);
    }

    body.display-page .display-header .display-status {
      font-size: clamp(18px, 3vh, 36px);
    }

    body.display-page .display-status {
      font-size: clamp(16px, 2.4vh, 28px);
      margin-bottom: 8px;
    }

    body.display-page .qr-box img {
      width: min(100%, 44vh);
      height: min(100%, 44vh);
      max-width: min(100%, 44vh);
      max-height: min(100%, 44vh);
    }

    body.display-page .qr-box.is-loading #qr-code {
      min-height: 44vh;
    }

    body.display-page .display-info-card h3 {
      font-size: clamp(18px, 2.6vh, 32px);
    }

    body.display-page .display-info-card #display-subtitle,
    body.display-page .display-qr-hint {
