<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>候補登記</title>
  <?!= include('styles'); ?>
</head>
<body>
  <div class="container" id="app">
    <div id="screen-form" class="card">
      <h1 id="page-title">候補登記</h1>
      <p id="display-title" class="muted"></p>
      <p id="display-subtitle" class="muted"></p>
      <p id="deadline-info" class="muted"></p>
      <p id="session-countdown" class="muted hidden"></p>
      <p id="session-loading" class="muted">正在驗證 QR Code…</p>
      <div class="field">
        <label for="name">真實姓名</label>
        <input id="name" type="text" autocomplete="name" placeholder="王小明">
      </div>
      <div class="field">
        <label for="phone">手機號碼</label>
        <input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="0912345678">
      </div>
      <button class="btn btn-primary" id="btn-confirm" style="width:100%">確認資料</button>
      <p id="form-error" class="muted" style="color:#f87171;margin-top:12px;"></p>
    </div>

    <div id="screen-review" class="card hidden">
      <h2>請確認以下資料</h2>
      <p>姓名：<strong id="review-name"></strong></p>
      <p>電話：<strong id="review-phone"></strong></p>
      <div style="display:flex;gap:12px;margin-top:20px;">
        <button class="btn btn-secondary" id="btn-back" style="flex:1">返回修改</button>
        <button class="btn btn-primary" id="btn-submit" style="flex:1">確認無誤</button>
      </div>
      <p id="review-countdown" class="muted hidden"></p>
      <p id="review-error" class="muted" style="color:#f87171;margin-top:12px;"></p>
    </div>

    <div id="screen-pin" class="warning-screen hidden">
      <div class="container">
        <div class="card">
          <h2>🟧 候補資料已確認</h2>
          <p>姓名：<strong id="pin-name"></strong></p>
          <p>電話：<strong id="pin-phone"></strong></p>
          <p class="muted">此資料已鎖定，無法修改。請將手機交由現場工作人員操作。</p>
          <div class="field">
            <label for="staff-pin">工作人員 PIN</label>
            <input id="staff-pin" type="password" inputmode="numeric" maxlength="8" placeholder="••••">
          </div>
          <button class="btn btn-primary" id="btn-pin-submit" style="width:100%">完成候補登記</button>
          <p id="pin-error" class="muted" style="color:#f87171;margin-top:12px;"></p>
        </div>
      </div>
    </div>

    <div id="screen-success" class="success-screen hidden">
      <div class="success-card">
        <h2>✓ 候補登記成功</h2>
        <div class="success-no" id="success-no">#001</div>
        <p id="success-name"></p>
        <p id="success-phone"></p>
        <p id="success-time" class="muted"></p>
        <p class="muted">請截圖保存本畫面作為憑證</p>
      </div>
    </div>

    <div id="screen-error" class="container hidden">
      <div class="card">
        <h2 id="error-title">無法完成登記</h2>
        <p id="error-message" class="muted"></p>
      </div>
    </div>
  </div>

  <?!= include('client-utils'); ?>
  <script>
    const UI = window.WaitlistUI;
    const INITIAL_TOKEN = <?!= initialToken ?>;
    const INITIAL_RECEIPT = <?!= initialReceipt ?>;
    const DEVICE_ID_KEY = 'waitlist_candidate_device_id';

    function getDeviceId() {
      let id = localStorage.getItem(DEVICE_ID_KEY);

      if (!id) {
        id =
          'dev_' +
          Date.now() +
          '_' +
          Math.random().toString(36).slice(2);

        localStorage.setItem(DEVICE_ID_KEY, id);
      }

      return id;
    }

    let token = INITIAL_TOKEN;
    let receipt = INITIAL_RECEIPT;

    let formSessionId = '';
    let mode = 'general';
    let pending = null;
    let sessionReady = false;
    let pinLockoutTimer = null;
    let sessionKeepaliveTimer = null;
    let countdownTimer = null;
    let sessionExpiresAt = 0;
    let currentScreen = 'screen-form';
    const PIN_KEEPALIVE_MS = 45000;
    let requestId = (typeof crypto !== 'undefined' && crypto.randomUUID)
      ? crypto.randomUUID()
      : ('req_' + Date.now() + '_' + Math.random().toString(36).slice(2));

    function post(action, body) {
      return new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(function(response) {
            resolve(response);
          })
          .withFailureHandler(function(error) {
            reject(
              new Error(
                error && error.message
                  ? error.message
                  : '無法連線至伺服器'
              )
            );
          })
          .apiCall(action, body || {});
      });
    }

    function setFormEnabled(enabled) {
      document.getElementById('name').disabled = !enabled;
      document.getElementById('phone').disabled = !enabled;
      document.getElementById('btn-confirm').disabled = !enabled;
    }

    function applyDisplayInfo(data) {
      if (!data) return;
      const eventLabel = [data.event_name, data.session_name].filter(Boolean).join('｜');
      if (eventLabel) {
        document.getElementById('page-title').textContent = eventLabel;
      }
      const titleEl = document.getElementById('display-title');
      const subtitleEl = document.getElementById('display-subtitle');
      titleEl.textContent = data.display_title || '';
      subtitleEl.textContent = data.display_subtitle || '';
      titleEl.classList.toggle('hidden', !data.display_title);
      subtitleEl.classList.toggle('hidden', !data.display_subtitle);
    }

    function show(id) {
      currentScreen = id;
      ['screen-form', 'screen-review', 'screen-pin', 'screen-success', 'screen-error'].forEach(s => {
        document.getElementById(s).classList.toggle('hidden', s !== id);
      });
      syncSessionKeepalive();
      syncCountdownDisplay();
    }

    function showError(title, message) {
      stopSessionKeepalive();
      stopCountdown();
      document.getElementById('error-title').textContent = title;
      document.getElementById('error-message').textContent = message;
      show('screen-error');
    }

    function stopSessionKeepalive() {
      if (sessionKeepaliveTimer) {
        clearInterval(sessionKeepaliveTimer);
        sessionKeepaliveTimer = null;
      }
    }

    function stopCountdown() {
      if (countdownTimer) {
        clearInterval(countdownTimer);
        countdownTimer = null;
      }
    }

    function updateSessionExpiry(expiresAt) {
      sessionExpiresAt = Number(expiresAt) || 0;
      syncCountdownDisplay();
    }

    function formatRemainingSeconds(totalSeconds) {
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return minutes + ':' + String(seconds).padStart(2, '0');
    }

    function getCountdownElements() {
      return [
        document.getElementById('session-countdown'),
        document.getElementById('review-countdown')
      ];
    }

    function syncCountdownDisplay() {
      const showCountdown =
        currentScreen === 'screen-form' || currentScreen === 'screen-review';

      getCountdownElements().forEach(el => {
        if (!el) return;
        el.classList.toggle('hidden', !showCountdown || !sessionExpiresAt);
      });

      if (!showCountdown || !sessionExpiresAt) {
        stopCountdown();
        return;
      }

      updateCountdownText();
      if (!countdownTimer) {
        countdownTimer = setInterval(updateCountdownText, 1000);
      }
    }

    function updateCountdownText() {
      const remaining = sessionExpiresAt - Math.floor(Date.now() / 1000);
      const text = remaining <= 0
        ? '填寫時間已到期，請重新掃描 QR Code'
        : '剩餘填寫時間：' + formatRemainingSeconds(remaining);

      getCountdownElements().forEach(el => {
        if (el && !el.classList.contains('hidden')) {
          el.textContent = text;
        }
      });

      if (remaining <= 0 && currentScreen !== 'screen-pin') {
        handleSessionLost('SESSION_EXPIRED');
      }
    }

    async function refreshFormSession(options) {
      options = options || {};
      if (!formSessionId) {
        throw new Error('QR 驗證尚未完成，請稍候或重新掃描');
      }

      const action = options.checkOnly ? 'checkFormSession' : 'extendFormSession';
      const res = await post(action, { form_session_id: formSessionId });

      if (!res.ok) {
        if (!options.silent) {
          throw new Error(res.error?.message || '填寫時間已過期，請重新掃描 QR Code');
        }
        handleSessionLost(res.error?.code, res.error?.message);
        return null;
      }

      if (res.data.expires_at) {
        updateSessionExpiry(res.data.expires_at);
      }
      return res.data;
    }

    function handleSessionLost(code, message) {
      stopSessionKeepalive();
      stopCountdown();
      clearPinLockoutTimer();
      setFormEnabled(false);
      setPinSubmitEnabled(false);

      const closed = code === 'REGISTRATION_CLOSED' || code === 'NO_ACTIVE_EVENT';
      const msg = closed
        ? (message || '本場候補登記已結束。')
        : (currentScreen === 'screen-pin'
          ? '等待過久，請重新掃描現場 QR Code。'
          : (message || '填寫時間已過期，請重新掃描 QR Code。'));

      if (currentScreen === 'screen-pin') {
        document.getElementById('pin-error').textContent = msg;
        return;
      }
      if (currentScreen === 'screen-review') {
        document.getElementById('review-error').textContent = msg;
        document.getElementById('btn-submit').disabled = true;
        return;
      }
      if (currentScreen === 'screen-form') {
        document.getElementById('form-error').textContent = msg;
        return;
      }

      showError(closed ? '候補登記已結束' : '登記已逾時', msg);
    }

    function syncSessionKeepalive() {
      stopSessionKeepalive();

      // 填表／確認階段不自動 extend，維持 form_session_ttl 防 QR 外流。
      // 僅櫃檯 PIN 等待階段续命（已完成確認、需現場 PIN 才能完成登記）。
      if (currentScreen === 'screen-pin') {
        sessionKeepaliveTimer = setInterval(function () {
          refreshFormSession({ silent: true }).catch(function () {
            // 網路暫時失敗時保留畫面，下一輪再試
          });
        }, PIN_KEEPALIVE_MS);
      }
    }

    function persistReceiptInUrl(receiptToken) {
      receipt = receiptToken;
      token = '';
      const query = '?page=candidate&receipt=' + encodeURIComponent(receiptToken);
      try {
        history.replaceState({}, '', query);
      } catch (e) {
        // GAS sandbox runs on googleusercontent.com; absolute script.google.com URLs fail.
      }
    }

    function showSuccess(data) {
      document.getElementById('success-no').textContent = data.waitlist_no;
      document.getElementById('success-name').textContent = data.name;
      document.getElementById('success-phone').textContent = data.phone_masked;
      document.getElementById('success-time').textContent = '登記時間 ' + formatTime(data.registered_at);
      if (data.receipt_token) {
        persistReceiptInUrl(data.receipt_token);
      }
      show('screen-success');
    }

    function formatTime(value) {
      const d = new Date(value);
      if (isNaN(d.getTime())) return String(value || '');
      return d.toLocaleString('zh-TW', { hour12: false });
    }

    function validateForm() {
      const name = document.getElementById('name').value.trim();
      const phone = document.getElementById('phone').value.trim();
      if (name.length < 2) throw new Error('請輸入有效的真實姓名');
      if (!/^09\d{8}$/.test(phone.replace(/[\s\-()]/g, ''))) throw new Error('請輸入有效的手機號碼（09xxxxxxxx）');
      return { name, phone: phone.replace(/[\s\-()]/g, '') };
    }

    async function initSession() {
      if (receipt) {
        const res = await post('getReceipt', { receipt_token: receipt });
        if (res.ok) return showSuccess(res.data);
        showError('找不到紀錄', res.error?.message || '憑證無效');
        return;
      }

      if (!token) {
        showError('缺少 QR Token', '請掃描現場 Display 上的 QR Code。');
        return;
      }

      const res = await UI.postWithRetry(post, 'validateToken', { token });
      if (!res.ok) {
        const code = res.error?.code;

        if (
          code === 'REGISTRATION_CLOSED' ||
          code === 'NO_ACTIVE_EVENT'
        ) {
          showError(
            '候補登記已結束',
            res.error?.message || '本場候補登記目前未開放。'
          );
          return;
        }

        if (code === 'TOKEN_EXPIRED') {
          showError(
            'QR 已失效',
            res.error?.message || '請重新掃描現場目前顯示的 QR Code。'
          );
          return;
        }

        showError(
          '無法完成驗證',
          res.error?.message || '請稍後再試。'
        );
        return;
      }

      formSessionId = res.data.form_session_id;
      mode = res.data.mode || 'general';
      sessionReady = true;
      if (res.data.expires_at) {
        updateSessionExpiry(res.data.expires_at);
      }
      applyDisplayInfo(res.data);
      if (res.data.show_deadline && res.data.deadline) {
        document.getElementById('deadline-info').textContent = '候補登記截止時間：' + res.data.deadline;
      }
    }

    async function ensureFormSession() {
      await refreshFormSession();
    }

    document.getElementById('btn-confirm').addEventListener('click', () => {
      const btn = document.getElementById('btn-confirm');
      document.getElementById('form-error').textContent = '';
      UI.runWithLoading(btn, '確認中…', async () => {
        if (!sessionReady) {
          throw new Error('QR 驗證尚未完成，請稍候');
        }
        pending = validateForm();
        await ensureFormSession();
        document.getElementById('review-name').textContent = pending.name;
        document.getElementById('review-phone').textContent = pending.phone;
        document.getElementById('review-error').textContent = '';
        show('screen-review');
      }).catch(function (e) {
        document.getElementById('form-error').textContent = e.message || '無法進入確認畫面';
      });
    });

    document.getElementById('btn-back').addEventListener('click', () => {
      document.getElementById('btn-submit').disabled = false;
      document.getElementById('review-error').textContent = '';
      show('screen-form');
    });

    document.getElementById('btn-submit').addEventListener('click', () => {
      const btn = document.getElementById('btn-submit');
      if (!pending || btn.disabled) return;
      if (mode === 'counter') {
        UI.runWithOverlay('鎖定資料中…', () => enterPinStage())
          .catch(e => {
            document.getElementById('review-error').textContent = e.message || '無法進入 PIN 核驗';
          });
        return;
      }
      UI.runWithOverlay('登記中…', () => submitRegistration(null))
        .catch(e => {
          document.getElementById('review-error').textContent = e.message || '登記失敗，請稍後再試';
        });
    });

    async function enterPinStage() {
      await ensureFormSession();
      const res = await post('lockForPinVerification', {
        form_session_id: formSessionId,
        name: pending.name,
        phone: pending.phone
      });
      if (!res.ok) {
        throw new Error(res.error?.message || '無法鎖定資料，請重新確認');
      }
      await refreshFormSession();
      document.getElementById('pin-name').textContent = pending.name;
      document.getElementById('pin-phone').textContent = pending.phone.slice(0, 4) + '***' + pending.phone.slice(-3);
      document.getElementById('pin-error').textContent = '';
      document.getElementById('staff-pin').value = '';
      clearPinLockoutTimer();
      setPinSubmitEnabled(true);
      show('screen-pin');
    }

    function clearPinLockoutTimer() {
      if (pinLockoutTimer) {
        clearInterval(pinLockoutTimer);
        pinLockoutTimer = null;
      }
    }

    function setPinSubmitEnabled(enabled) {
      const btn = document.getElementById('btn-pin-submit');
      const input = document.getElementById('staff-pin');
      btn.disabled = !enabled;
      input.disabled = !enabled;
    }

    function startPinLockout(seconds) {
      clearPinLockoutTimer();
      let remaining = Math.max(1, Number(seconds) || 30);
      setPinSubmitEnabled(false);
      const errorEl = document.getElementById('pin-error');
      errorEl.textContent = 'PIN 錯誤次數過多，請 ' + remaining + ' 秒後再試（僅鎖定此裝置，不影響其他選手）。';
      pinLockoutTimer = setInterval(() => {
        remaining -= 1;
        if (remaining <= 0) {
          clearPinLockoutTimer();
          setPinSubmitEnabled(true);
          errorEl.textContent = '';
          return;
        }
        errorEl.textContent = 'PIN 錯誤次數過多，請 ' + remaining + ' 秒後再試（僅鎖定此裝置，不影響其他選手）。';
      }, 1000);
    }

    document.getElementById('btn-pin-submit').addEventListener('click', () => {
      const btn = document.getElementById('btn-pin-submit');
      if (btn.disabled) return;
      const pin = document.getElementById('staff-pin').value;
      UI.runWithOverlay('登記中…', () => submitRegistration(pin))
        .catch(e => {
          document.getElementById('pin-error').textContent = e.message || '登記失敗，請稍後再試';
        });
    });

    async function submitRegistration(staffPin) {
      if (mode !== 'counter') {
        await ensureFormSession();
      }

      const payload = {
        request_id: requestId,
        form_session_id: formSessionId,
        name: pending.name,
        phone: pending.phone,
        device_id: getDeviceId()
      };
      if (staffPin) payload.staff_pin = staffPin;

      const action = mode === 'counter' ? 'verifyAndRegister' : 'register';
      const res = await UI.postWithRetry(post, action, payload);

      if (res.ok) {
        stopSessionKeepalive();
        stopCountdown();
        showSuccess(res.data);
        return;
      }

      if (res.error?.code === 'DUPLICATE' && res.error.waitlist_no) {
        showSuccess(res.error);
        return;
      }

      const code = res.error?.code;
      const msg = res.error?.message || '登記失敗';
      if (mode === 'counter') {
        if (code === 'PIN_SESSION_EXHAUSTED') {
          showError('PIN 嘗試次數已用盡', msg || '請重新掃描現場 QR Code 後再登記。');
          return;
        }
        if (code === 'SESSION_EXPIRED') {
          showError('登記已逾時', msg || '等待過久，請重新掃描現場 QR Code。');
          return;
        }
        if (code === 'PIN_LOCKED') {
          startPinLockout(res.error?.lockout_seconds);
          return;
        }
        document.getElementById('pin-error').textContent = msg;
        document.getElementById('staff-pin').value = '';
        document.getElementById('staff-pin').focus();
      } else {
        document.getElementById('review-error').textContent = msg;
      }
    }

    async function bootstrap() {
      setFormEnabled(false);
      try {
        await initSession();
      } catch (e) {
        showError('連線失敗', e.message || '無法連線至伺服器，請重新掃描 QR Code');
      } finally {
        document.getElementById('session-loading').classList.add('hidden');
        if (sessionReady) {
          setFormEnabled(true);
          syncCountdownDisplay();
        }
      }
    }

    function startApp() {
      if (INITIAL_TOKEN || INITIAL_RECEIPT) {
        bootstrap();
        return;
      }
      if (typeof google !== 'undefined' && google.script && google.script.url) {
        google.script.url.getLocation(function(location) {
          token = location.parameter.token || '';
          receipt = location.parameter.receipt || '';
          bootstrap();
        });
        return;
      }
      const params = new URLSearchParams(window.location.search);
      token = params.get('token') || '';
      receipt = params.get('receipt') || '';
      bootstrap();
    }

    startApp();
  </script>
</body>
</html>
