<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>候補登記 Display</title>
  <?!= include('styles'); ?>
</head>
<body class="display-page">
  <div class="container display-container" id="app">
    <div id="screen-open" class="hidden display-screen">
      <div class="display-header">
        <div class="display-title" id="event-title">活動名稱｜場次</div>
        <div class="display-status">候補登記開放中</div>
      </div>
      <div class="grid-2 display-grid">
        <div class="card display-qr-card">
          <div class="qr-box"><div id="qr-code"></div></div>
          <p class="muted display-qr-hint">請掃描 QR Code<br>填寫真實姓名與手機號碼</p>
          <p id="qr-countdown" class="muted display-qr-hint hidden"></p>
        </div>
        <div class="card display-info-card">
          <h3>現場說明</h3>
          <p id="display-subtitle" class="muted">候補資格以 Server 成功發出唯一候補序號為準。</p>
          <div id="display-image-wrap" class="display-image-wrap hidden">
            <img id="display-image" class="display-image" alt="現場說明圖">
          </div>
          <div id="display-stats" class="display-stats hidden">
            <div id="waitlist-count-row" class="display-stat hidden">
              <span class="display-stat-label">目前候補人數</span>
              <span class="display-stat-value" id="waitlist-count">0</span>
            </div>
            <div id="deadline-row" class="display-stat hidden">
              <span class="display-stat-label">候補截止時間</span>
              <span class="display-stat-value" id="deadline-display"></span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="screen-processing" class="hidden">
      <div class="display-title" id="event-title-2">活動名稱｜場次</div>
      <div class="display-status" id="status-processing">候補作業進行中</div>
      <div class="card">
        <p id="display-subtitle-2" class="muted" style="text-align:center;"></p>
        <p id="deadline-text-2" class="muted" style="text-align:center;"></p>
      </div>
    </div>

    <div id="screen-closed">
      <div class="display-title" id="event-title-3">候補登記系統</div>
      <div class="display-status" id="closed-status">尚未建立場次</div>
      <p id="display-subtitle-3" class="muted" style="text-align:center;margin-top:16px;"></p>
    </div>

    <div id="screen-lottery" class="hidden">
      <div class="display-title" id="event-title-4">活動名稱｜場次</div>
      <div class="display-status" id="lottery-title">候補抽選結果</div>
      <div class="lottery-grid" id="lottery-grid"></div>
      <p id="lottery-page" class="muted" style="text-align:center;margin-top:24px;"></p>
    </div>
  </div>

  <div id="connection-status" class="display-connection display-connection-ok hidden" aria-live="polite"></div>

  <script>
    const WEB_APP_URL = '<?= webAppUrl ?>';
    const INITIAL_STATE = <?!= initialStateJson ?>;
    let lastState = null;
    let carouselTimer = null;
    let pollTimer = null;
    let pollIntervalMs = 10000;
    let qrCountdownTimer = null;
    let qrCountdownMeta = null;
    let currentQrUrl = '';
    let lastOpenSnapshot = '';
    let lotteryRuntime = null;
    let connectionFailCount = 0;
    let connectionVisible = false;
    let loadedDisplayImageFileId = '';
    let displayImageRequest = null;

    function post(action, body) {
      return new Promise(function (resolve, reject) {
        google.script.run
          .withSuccessHandler(function (response) {
            resolve(response);
          })
          .withFailureHandler(function (error) {
            reject(
              new Error(
                error && error.message
                  ? error.message
                  : '無法連線至伺服器'
              )
            );
          })
          .apiCall(action, body || {});
      });
    }

    function showScreen(id) {
      ['screen-open', 'screen-processing', 'screen-closed', 'screen-lottery'].forEach(s => {
        document.getElementById(s).classList.toggle('hidden', s !== id);
      });
    }

    var DEFAULT_SUBTITLE = '候補資格以 Server 成功發出唯一候補序號為準。';

    function setConnectionStatus(state) {
      const el = document.getElementById('connection-status');
      if (!el) return;
      connectionVisible = true;
      el.classList.remove('hidden', 'display-connection-ok', 'display-connection-syncing', 'display-connection-warn');
      if (state === 'syncing') {
        el.classList.add('display-connection-syncing');
        el.textContent = '重新連線中…';
      } else if (state === 'warn') {
        el.classList.add('display-connection-warn');
        el.textContent = '連線不穩，顯示可能不是最新';
      } else {
        el.classList.add('display-connection-ok');
        el.textContent = '已連線';
      }
    }

    function renderQr(url) {
      const container = document.getElementById('qr-code');
      const qrBox = container ? container.closest('.qr-box') : null;

      if (!container) {
        console.error('QR container not found');
        return;
      }

      if (!url) {
        container.innerHTML = '';
        currentQrUrl = '';
        if (qrBox) qrBox.classList.remove('is-loading');
        return;
      }

      if (url === currentQrUrl) {
        return;
      }

      if (qrBox) qrBox.classList.add('is-loading');

      const img = document.createElement('img');
      img.alt = 'QR Code';
      img.src =
        'https://api.qrserver.com/v1/create-qr-code/?size=512x512&data=' +
        encodeURIComponent(url);

      img.onload = function () {
        container.replaceChildren(img);
        currentQrUrl = url;
        if (qrBox) qrBox.classList.remove('is-loading');
      };

      img.onerror = function () {
        console.error('QR image failed to load');
        currentQrUrl = '';
        if (qrBox) qrBox.classList.remove('is-loading');
      };
    }

    function formatEventTitle(state) {
      if (!state.has_active_event) return '候補登記系統';
      const title = [state.event_name, state.session_name].filter(Boolean).join('｜');
      return title || '候補登記';
    }

    function formatStatusText(state, fallback) {
      const custom = (state.display_title || '').trim();
      return custom || fallback;
    }

    function formatSubtitleText(state) {
      const custom = (state.display_subtitle || '').trim();
      return custom || DEFAULT_SUBTITLE;
    }

    function renderDeadlineElement(el, deadline, show) {
      if (!el) return;
      const row = el.closest('#deadline-row') || el;
      const visible = !!(show && deadline);
      if (row.id === 'deadline-row') {
        row.classList.toggle('hidden', !visible);
        if (visible) {
          el.textContent = deadline;
        }
        return;
      }
      el.textContent = visible ? ('候補登記截止時間：' + deadline) : '';
    }

    function syncInfoCardLayout(state) {
      const card = document.querySelector('.display-info-card');
      if (!card) return;

      const hasImage = !!(state.show_display_image && state.display_image_file_id);
      const hasStats = !!(
        state.show_waitlist_count ||
        (state.show_deadline && state.deadline)
      );

      card.classList.toggle('display-info-card-no-image', !hasImage);
      card.classList.toggle('display-info-card-no-stats', !hasStats);
    }

    async function renderDisplayImage(state) {
      const wrap = document.getElementById('display-image-wrap');
      const img = document.getElementById('display-image');
      if (!wrap || !img) return;

      const fileId = state.display_image_file_id || '';
      const showImage = !!(state.show_display_image && fileId);

      wrap.classList.toggle('hidden', !showImage);
      syncInfoCardLayout(state);
      if (!showImage) {
        loadedDisplayImageFileId = '';
        img.removeAttribute('src');
        return;
      }

      if (loadedDisplayImageFileId === fileId && img.getAttribute('src')) {
        return;
      }

      if (displayImageRequest) {
        return displayImageRequest;
      }

      displayImageRequest = post('getPublicDisplayImage')
        .then(function (res) {
          if (res.ok && res.data.has_image && res.data.data_url) {
            img.src = res.data.data_url;
            loadedDisplayImageFileId = res.data.file_id || fileId;
          }
        })
        .catch(function (e) {
          console.warn('display image load failed', e);
        })
        .finally(function () {
          displayImageRequest = null;
        });

      return displayImageRequest;
    }

    function renderDisplayStats(state) {
      const statsEl = document.getElementById('display-stats');
      const waitlistRow = document.getElementById('waitlist-count-row');
      const waitlistCountEl = document.getElementById('waitlist-count');
      const deadlineRow = document.getElementById('deadline-row');
      const deadlineDisplayEl = document.getElementById('deadline-display');

      const showWaitlist = !!state.show_waitlist_count;
      const showDeadline = !!(state.show_deadline && state.deadline);

      if (waitlistRow) {
        waitlistRow.classList.toggle('hidden', !showWaitlist);
      }
      if (waitlistCountEl) {
        waitlistCountEl.textContent = state.waitlist_count || 0;
      }

      renderDeadlineElement(deadlineDisplayEl, state.deadline, state.show_deadline);

      if (statsEl) {
        statsEl.classList.toggle('hidden', !showWaitlist && !showDeadline);
        statsEl.classList.toggle(
          'display-stats-single',
          (showWaitlist && !showDeadline) || (!showWaitlist && showDeadline)
        );
      }

      syncInfoCardLayout(state);
    }

    function stopQrCountdown() {
      clearInterval(qrCountdownTimer);
      qrCountdownTimer = null;
      qrCountdownMeta = null;
    }

    function renderQrCountdown() {
      const countdownEl = document.getElementById('qr-countdown');

      if (!qrCountdownMeta) {
        countdownEl.classList.add('hidden');
        return;
      }

      countdownEl.classList.remove('hidden');
      countdownEl.textContent =
        'QR Code 每 ' + qrCountdownMeta.interval + ' 秒更新一次';
    }

    function startQrCountdown(qr, showCountdown) {
      if (!qr || !qr.rotation_enabled || !showCountdown) {
        if (qrCountdownMeta) {
          stopQrCountdown();
          renderQrCountdown();
        }
        return;
      }

      if (qrCountdownMeta &&
          qrCountdownMeta.interval === qr.interval &&
          qrCountdownMeta.expiresAt === qr.expires_at &&
          qrCountdownTimer) {
        return;
      }

      stopQrCountdown();
      qrCountdownMeta = {
        interval: qr.interval,
        expiresAt: qr.expires_at
      };
      renderQrCountdown();
    }

    function openSnapshot(state) {
      const qr = state.qr || {};
      return [
        formatEventTitle(state),
        formatStatusText(state, '候補登記開放中'),
        state.waitlist_count || 0,
        !!state.show_waitlist_count,
        formatSubtitleText(state),
        state.deadline || '',
        !!state.show_deadline,
        !!state.qr_visible,
        qr.url || '',
        qr.expires_at || 0,
        qr.interval || 0,
        !!qr.rotation_enabled,
        !!state.show_qr_countdown,
        !!state.show_display_image,
        state.display_image_file_id || ''
      ].join('\0');
    }

    function getLotteryKey(lottery) {
      if (!lottery) return '';
      const entries = lottery.entries || (lottery.numbers || []).map(function (no) {
        return { waitlist_no: no };
      });
      return [
        lottery.batch_id || '',
        lottery.display_title || '',
        lottery.results_per_page || 16,
        lottery.results_columns || 0,
        lottery.carousel_seconds || 5,
        !!lottery.show_page_number,
        !!lottery.show_random_rank,
        JSON.stringify(entries)
      ].join('\0');
    }

    function buildLotteryPages(lottery) {
      const perPage = lottery.results_per_page || 16;
      const entries = lottery.entries || lottery.numbers.map(function (no) {
        return { waitlist_no: no };
      });
      const pages = [];
      for (let i = 0; i < entries.length; i += perPage) {
        pages.push(entries.slice(i, i + perPage));
      }
      if (pages.length === 0) pages.push([]);
      return pages;
    }

    function renderLotteryPage() {
      if (!lotteryRuntime) return;
      const lottery = lotteryRuntime.lottery;
      const pages = lotteryRuntime.pages;
      const grid = document.getElementById('lottery-grid');
      grid.innerHTML = '';
      if (lottery.results_columns > 0) {
        grid.style.gridTemplateColumns = 'repeat(' + lottery.results_columns + ', 1fr)';
      } else {
        grid.style.gridTemplateColumns = '';
      }
      pages[lotteryRuntime.carouselPage].forEach(function (entry) {
        const div = document.createElement('div');
        div.className = 'lottery-no';
        if (lottery.show_random_rank && entry.random_rank) {
          div.innerHTML = '<span class="lottery-rank">' + entry.random_rank + '</span>' +
            '<span class="lottery-waitlist-no">' + entry.waitlist_no + '</span>';
        } else {
          div.textContent = entry.waitlist_no;
        }
        grid.appendChild(div);
      });
      const pageEl = document.getElementById('lottery-page');
      if (lottery.show_page_number && pages.length > 1) {
        pageEl.textContent = '第 ' + (lotteryRuntime.carouselPage + 1) + ' / ' + pages.length + ' 頁';
      } else {
        pageEl.textContent = '請確認您的候補號碼';
      }
    }

    function startLotteryCarousel() {
      clearInterval(carouselTimer);
      if (!lotteryRuntime || lotteryRuntime.pages.length <= 1) return;
      carouselTimer = setInterval(function () {
        lotteryRuntime.carouselPage = (lotteryRuntime.carouselPage + 1) % lotteryRuntime.pages.length;
        renderLotteryPage();
      }, (lotteryRuntime.lottery.carousel_seconds || 5) * 1000);
    }

    function renderOpen(state) {
      showScreen('screen-open');
      const snap = openSnapshot(state);
      if (snap === lastOpenSnapshot) {
        return;
      }
      lastOpenSnapshot = snap;

      document.getElementById('event-title').textContent = formatEventTitle(state);
      document.querySelector('#screen-open .display-status').textContent =
        formatStatusText(state, '候補登記開放中');
      document.getElementById('display-subtitle').textContent =
        formatSubtitleText(state);

      renderDisplayImage(state);
      renderDisplayStats(state);

      if (state.qr_visible && state.qr && state.qr.url) {
        renderQr(state.qr.url);
      } else {
        renderQr('');
      }

      startQrCountdown(state.qr, state.show_qr_countdown);
    }

    function renderProcessing(state) {
      stopQrCountdown();
      showScreen('screen-processing');

      document.getElementById('event-title-2').textContent =
        formatEventTitle(state);

      document.getElementById('status-processing').textContent =
        '候補作業進行中';

      document.getElementById('display-subtitle-2').textContent = '';

      renderDeadlineElement(
        document.getElementById('deadline-text-2'),
        state.deadline,
        state.show_deadline
      );
    }

    function renderClosed(state) {
      stopQrCountdown();
      showScreen('screen-closed');
      document.getElementById('event-title-3').textContent = formatEventTitle(state);
      const closedFallback = state.has_active_event ? '候補登記已關閉' : '尚未建立場次';
      document.getElementById('closed-status').textContent = formatStatusText(state, closedFallback);
      document.getElementById('display-subtitle-3').textContent = formatSubtitleText(state);
    }

    function renderLottery(state) {
      stopQrCountdown();
      showScreen('screen-lottery');
      document.getElementById('event-title-4').textContent = formatEventTitle(state);
      const lottery = state.lottery_display;
      if (!lottery) return;

      document.getElementById('lottery-title').textContent = lottery.display_title;
      const key = getLotteryKey(lottery);
      if (lotteryRuntime && lotteryRuntime.key === key) {
        return;
      }

      lotteryRuntime = {
        key: key,
        lottery: lottery,
        pages: buildLotteryPages(lottery),
        carouselPage: 0
      };
      renderLotteryPage();
      startLotteryCarousel();
    }

    function getViewMode(state) {
      const mode = state.display_mode || 'CLOSED';
      if (mode === 'LOTTERY_RESULT') return 'lottery';
      if (!state.registration_enabled) return 'closed';
      if (state.registration_enabled && state.qr_visible) return 'open';
      if (state.registration_enabled && !state.qr_visible) return 'processing';
      return 'closed';
    }

    function renderState(state) {
      const view = getViewMode(state);
      if (lastState && getViewMode(lastState) !== view) {
        lastOpenSnapshot = '';
        lotteryRuntime = null;
        clearInterval(carouselTimer);
        carouselTimer = null;
      }
      lastState = state;
      if (view === 'lottery') return renderLottery(state);
      if (view === 'closed') return renderClosed(state);
      if (view === 'open') return renderOpen(state);
      if (view === 'processing') return renderProcessing(state);
      return renderClosed(state);
    }

    function getNextRefreshDelay() {
      const view =
        lastState
          ? getViewMode(lastState)
          : 'no-state';

      const qr =
        lastState && lastState.qr
          ? lastState.qr
          : {};

      console.log(
        '[QR refresh]',
        {
          view: view,
          rotation_enabled: qr.rotation_enabled,
          interval: qr.interval,
          expires_at: qr.expires_at,
          now: Math.floor(Date.now() / 1000),
          pollIntervalMs: pollIntervalMs
        }
      );

      if (
        lastState &&
        view === 'open' &&
        qr.rotation_enabled &&
        qr.expires_at
      ) {
        const untilExpiry =
         (qr.expires_at - qr.server_now) * 1000;

        const delay =
          Math.max(
            200,
            Math.min(
              10000,
              untilExpiry + 200
            )
          );

        console.log(
          '[QR refresh] untilExpiry =',
          untilExpiry,
          'delay =',
          delay
        );

        return delay;
      }

      console.log(
        '[QR refresh] fallback =',
        pollIntervalMs
      );

      return pollIntervalMs;
    }

    function scheduleRefresh() {
      clearTimeout(pollTimer);
      pollTimer = setTimeout(async () => {
        if (connectionVisible && connectionFailCount > 0) {
          setConnectionStatus('syncing');
        }
        try {
          const res = await post('getPublicState');
          if (res.ok) {
            renderState(res.data);
            pollIntervalMs = 10000;
            connectionFailCount = 0;
            setConnectionStatus('ok');
          }
        } catch (e) {
          console.warn('refresh failed, keep last screen', e);
          connectionFailCount += 1;
          pollIntervalMs = Math.min(Math.round(pollIntervalMs * 1.5), 30000);
          if (connectionFailCount >= 2) {
            setConnectionStatus('warn');
          }
        }
        scheduleRefresh();
      }, getNextRefreshDelay());
    }

    if (INITIAL_STATE) {
      renderState(INITIAL_STATE);
      setConnectionStatus('ok');
    }
    scheduleRefresh();
  </script>
</body>
</html>
